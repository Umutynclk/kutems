<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="drumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="drumBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#drumBg)" rx="16"/>
  <!-- Technical Grid -->
  <circle cx="200" cy="140" r="100" fill="none" stroke="#cbd5e1" stroke-width="0.75" stroke-dasharray="3,3" opacity="0.6"/>
  <!-- Outer Rim -->
  <circle cx="200" cy="140" r="85" fill="url(#drumBody)" stroke="#1e293b" stroke-width="3"/>
  <!-- Spiral Cable Grooves -->
  <circle cx="200" cy="140" r="72" fill="none" stroke="#e2e8f0" stroke-width="3"/>
  <circle cx="200" cy="140" r="60" fill="none" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="200" cy="140" r="48" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- Center Shaft Hub -->
  <circle cx="200" cy="140" r="32" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <rect x="188" y="112" width="24" height="6" fill="#f8fafc" rx="2"/>
  <circle cx="200" cy="140" r="18" fill="#0f172a"/>
  
  <!-- Dimension Badge -->
  <rect x="135" y="245" width="130" height="28" rx="6" fill="#0f172a" fill-opacity="0.85"/>
  <text x="200" y="264" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">FFNL18 / Normal Lift</text>
</svg>
