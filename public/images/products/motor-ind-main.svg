<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="motorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="motorBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#motorBg)" rx="16"/>
  <!-- Motor Main Body -->
  <rect x="110" y="70" width="160" height="130" rx="8" fill="url(#motorBody)" stroke="#1e293b" stroke-width="2"/>
  <!-- Cooling Fins -->
  <line x1="125" y1="80" x2="125" y2="190" stroke="#64748b" stroke-width="3"/>
  <line x1="140" y1="80" x2="140" y2="190" stroke="#64748b" stroke-width="3"/>
  <line x1="155" y1="80" x2="155" y2="190" stroke="#64748b" stroke-width="3"/>
  <!-- Gear Box / Shaft Output -->
  <rect x="270" y="95" width="45" height="80" rx="4" fill="#1e293b"/>
  <circle cx="292" cy="135" r="16" fill="#0284c7" stroke="#e0f2fe" stroke-width="3"/>
  <circle cx="292" cy="135" r="7" fill="#0f172a"/>
  <!-- Emergency Chain Hoist -->
  <rect x="65" y="105" width="45" height="60" rx="4" fill="#334155"/>
  <path d="M 80,165 L 80,230 M 95,165 L 95,230" stroke="#94a3b8" stroke-width="3" stroke-dasharray="3,3"/>
  
  <!-- Dimension Badge -->
  <rect x="130" y="245" width="140" height="28" rx="6" fill="#0f172a" fill-opacity="0.85"/>
  <text x="200" y="264" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">100Nm / 3x400V IP65</text>
</svg>
